version: '3.8'

services:
  web:
    build:
      context: ./apps/web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/web:/app
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/api:/app
    depends_on:
      - db

  db:
    image: postgres:13
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cambodia_charity
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
