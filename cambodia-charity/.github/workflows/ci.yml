name: CI/CD

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build project
        run: npm run build

      - name: Build Docker images
        run: |
          docker build -t web ./apps/web
          docker build -t api ./apps/api

      - name: Push Docker images to container registry
        run: |
          docker tag web registry.example.com/web:latest
          docker tag api registry.example.com/api:latest
          docker push registry.example.com/web:latest
          docker push registry.example.com/api:latest

      - name: Deploy Docker containers to production
        run: echo "Deploying Docker containers to production..."

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        run: echo "Deploying to staging environment..."

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying to production environment..."
